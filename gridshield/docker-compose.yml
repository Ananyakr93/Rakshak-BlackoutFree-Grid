services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gridshield}
      POSTGRES_USER: ${POSTGRES_USER:-gridshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridshield}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridshield} -d ${POSTGRES_DB:-gridshield}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gridshield}:${POSTGRES_PASSWORD:-gridshield}@postgres:5432/${POSTGRES_DB:-gridshield}
      EXPERIMENT_RESULTS_PATH: /experiments/baseline/results_e1_e4.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
    volumes:
      - ./experiments:/experiments:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  test-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "pytest", "tests/", "-v", "--tb=short"]
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gridshield}:${POSTGRES_PASSWORD:-gridshield}@postgres:5432/${POSTGRES_DB:-gridshield}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - test

volumes:
  postgres_data:
