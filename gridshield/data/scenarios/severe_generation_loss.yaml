# Stress test: severe generation loss (0.25 pu) for 600 s
# Tests S2 and S3 stages and feeder trip avoidance
name: "Severe Generation Loss Stress Test"
description: "Large generation loss (0.25 pu) lasting 10 minutes. Stresses S2/S3 shedding stages and tests whether P2 avoids feeder tripping."
seed: 42
simulation_duration_s: 900.0
area_mode: "scaled"

disturbance:
  type: "generation_loss"
  start_time_s: 10.0
  magnitude_pu: 0.25
  duration_s: 600.0
  recovery_ramp_s: 60.0

grid_params:
  H: 4.0
  D: 1.5
  R: 0.05
  deadband_hz: 0.03
  Tg: 0.1
  Tt: 0.4
  up_reserve_pu: 0.20
  down_reserve_pu: 0.10

buildings:
  - building_id: "B01"
    weight_k: 1
    appliances:
      - {appliance_id: "B01_A01", appliance_type: "split_ac_1ton", priority: "deferrable", rated_power_kw: 1.0, min_on_time_s: 120.0, min_off_time_s: 120.0, max_shed_minutes: 30.0, enrolled: true}
      - {appliance_id: "B01_A02", appliance_type: "geyser_15l", priority: "deferrable", rated_power_kw: 2.0, min_on_time_s: 60.0, min_off_time_s: 30.0, max_shed_minutes: 60.0, enrolled: true}
      - {appliance_id: "B01_A03", appliance_type: "ceiling_fan", priority: "essential", rated_power_kw: 0.075, min_on_time_s: 10.0, min_off_time_s: 10.0, max_shed_minutes: 15.0, enrolled: true}
      - {appliance_id: "B01_A04", appliance_type: "refrigerator", priority: "essential", rated_power_kw: 0.15, min_on_time_s: 30.0, min_off_time_s: 30.0, max_shed_minutes: 15.0, enrolled: true}
      - {appliance_id: "B01_A05", appliance_type: "medical_device", priority: "critical", rated_power_kw: 0.5, min_on_time_s: 0.0, min_off_time_s: 0.0, enrolled: true}

